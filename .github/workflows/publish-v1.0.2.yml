name: Publish myQuote v1.0.2 judge release
# Rebuild judge asset after quote-body notification and demo-parity update.
# Rebuild current judge asset after the logic-state audit.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.2

    steps:
      - uses: actions/checkout@v4

      - name: Validate production quote database
        run: python3 tools/validate_production_quotes.py app/src/main/assets/quotes.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable CI debug keystore
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/myquote-ci-debug.keystore"
          base64 --decode .github/ci-debug.keystore.b64 > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "CI_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "cd1202f07a664194685c122b585165b62000fb347cd2070a741e801c8f8c3ef9  $keystore_path" |
            sha256sum --check --status

      - uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: |
          chmod +x bootstrap-gradle.sh
          ./bootstrap-gradle.sh

      - name: Test, lint, and build judge APK
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintQa
          :app:assembleQa

      - name: Verify stable CI APK signing
        run: |
          set -euo pipefail
          expected="$(
            keytool -exportcert \
              -keystore "$CI_DEBUG_KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey 2>/dev/null |
              sha256sum |
              cut -d' ' -f1
          )"
          apk="app/build/outputs/apk/qa/app-qa.apk"
          actual="$(
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest/ { print tolower($2); exit }'
          )"
          test "$actual" = "$expected"

      - name: Prepare judge assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/qa/app-qa.apk dist/myQuote-v1.0.2-judge.apk
          (
            cd dist
            sha256sum myQuote-v1.0.2-judge.apk > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          # myQuote v1.0.2

          Current Shipaton judge build.

          - Source commit: \`${GITHUB_SHA}\`
          - Android workflow run: \`${GITHUB_RUN_ID}\`
          - Version: \`1.0.2\` (\`versionCode 3\`)
          - Build type: QA / judge APK
          - RevenueCat: Test Store configuration; no real charge
          - Signing: stable CI test signer; not a production Play Store signing key
          - Package/application ID: \`com.shipaton.quotesofwisdom\`

          This build includes the audited state fixes, 50-font offline quote library, and daily notifications that show the quote body with a single Read aloud action routed through the app.

          \`SHA256SUMS.txt\` is attached for integrity verification.
          EOF

      - name: Replace v1.0.2 judge assets
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" \
            dist/myQuote-v1.0.2-judge.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md

      - name: Record successful publication
        env:
          STATUS_BRANCH: fix/streak-foreground-open
          STATUS_PATH: .github/release-v1.0.2-status.txt
        run: |
          set -euo pipefail
          apk_sha="$(sha256sum dist/myQuote-v1.0.2-judge.apk | cut -d' ' -f1)"
          marker="$(
            printf 'tag=%s\nfilename=%s\nsource_sha=%s\nrun_id=%s\napk_sha256=%s\n' \
              "$TAG" \
              "myQuote-v1.0.2-judge.apk" \
              "$GITHUB_SHA" \
              "$GITHUB_RUN_ID" \
              "$apk_sha"
          )"
          encoded="$(printf '%s\n' "$marker" | base64 -w 0)"
          endpoint="repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}"
          existing_sha="$(
            gh api --method GET "$endpoint" \
              -f ref="$STATUS_BRANCH" \
              --jq '.sha' 2>/dev/null || true
          )"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "$endpoint" \
              -f message="Record v1.0.2 release replacement" \
              -f content="$encoded" \
              -f branch="$STATUS_BRANCH" \
              -f sha="$existing_sha" >/dev/null
          else
            gh api --method PUT "$endpoint" \
              -f message="Record v1.0.2 release replacement" \
              -f content="$encoded" \
              -f branch="$STATUS_BRANCH" >/dev/null
          fi
