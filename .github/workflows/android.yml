name: Android

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate production quote database
        run: python3 tools/validate_production_quotes.py app/src/main/assets/quotes.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore stable CI debug keystore
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/ci-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: |
          chmod +x bootstrap-gradle.sh
          ./bootstrap-gradle.sh

      - name: Build debug and optimized QA APKs
        run: ./gradlew :app:assembleDebug :app:assembleQa

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quotes-of-wisdom-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload optimized QA APK
        uses: actions/upload-artifact@v4
        with:
          name: quotes-of-wisdom-qa
          path: app/build/outputs/apk/qa/app-qa.apk
